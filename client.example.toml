# Copy to client.toml, change what you like, and run with:
#   python -m ok_doomer.client --config client.toml
# Anything you leave out keeps its default. Unknown keys are an error.

[render]
window_scale = 4        # window = 320x200 times this (drag to resize)
fullscreen = false      # F11 or Alt+Enter toggles while playing
integer_scaling = true  # whole-number scaling: crisp pixels, black borders
fov_degrees = 75.0
max_fps = 144           # 0 = uncapped
vsync = true
show_fps = true
name_scale = 1          # names over heads: 1 = 3x5 pixel letters, 2 = twice that
name_panel = true       # on a black panel (false: a black outline)
message_scale = 1       # HUD messages, in 5x7 pixel letters: 2 = twice that
max_messages = 6        # HUD messages stacked at once (each shows for 3 s)
# Flat floors and ceilings instead of the textured ones (set both):
# ceiling_colour = [205, 200, 180]
# floor_colour = [120, 108, 96]

[controls]
mouse_sensitivity = 0.0025   # radians per pixel
invert_mouse_y = false
turn_speed = 2.6             # radians per second, keyboard turning
forward = ["w", "up"]
back = ["s", "down"]
strafe_left = ["a"]
strafe_right = ["d"]
turn_left = ["left"]
turn_right = ["right"]
jump = ["space"]
crouch = ["left ctrl", "c"]
